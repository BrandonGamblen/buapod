<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Lotus 1.0 · Footing</title>
<style>
:root{--ink:#2c2c2a;--quiet:#5f5e5a;--line:#d8d4c9;--bg:#f7f4ee;--card:#fff;--accent:#8a4b12}
*{box-sizing:border-box}
body{margin:0;font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Thai",sans-serif;color:var(--ink);background:var(--bg)}
nav{position:sticky;top:0;z-index:5;background:rgba(247,244,238,.96);border-bottom:1px solid var(--line);display:flex;gap:4px;overflow-x:auto;padding:8px 12px}
nav a{flex:0 0 auto;padding:6px 10px;border-radius:8px;color:var(--ink);text-decoration:none;font-size:14px;font-weight:500}
nav a:hover,nav a.here{background:#ece6d9}
main{max-width:900px;margin:0 auto;padding:8px 12px 40px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin:8px 0}
.top h1{font-size:20px;margin:0}
.top .stage{font-size:14px;color:var(--quiet)}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.lang button{font:inherit;font-size:14px;padding:5px 12px;border:0;background:var(--card);cursor:pointer}
.lang button.on{background:var(--accent);color:#fff}
.fig{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.fig svg{display:block;width:100%;height:auto}
.bar{display:flex;align-items:center;gap:10px;margin:10px 0}
.arrow{flex:0 0 auto;width:56px;height:56px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-size:26px;cursor:pointer;line-height:56px;padding:0}
.arrow:disabled{background:#d8d4c9;cursor:default}
.mid{flex:1;text-align:center}
.count{font-weight:700}
.dots{display:flex;justify-content:center;gap:6px;margin-top:4px}
.dots button{width:12px;height:12px;border-radius:50%;border:0;padding:0;background:#d8d4c9;cursor:pointer}
.dots button.on{background:var(--accent)}
.txt{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
.txt h2{font-size:20px;margin:0 0 6px}
.txt ol,.txt ul{padding-left:22px;margin:6px 0}
.txt li{margin:4px 0}
.note{font-size:14px;color:var(--quiet)}
a{color:var(--accent)}
</style></head><body>
<nav><a href="index.html">Home</a><a href="footing.html" class="here">Footing</a><a href="pedestal.html">Pedestal</a><a href="dome.html">Dome</a><a href="fins.html">Fins</a><a href="door.html">Door</a><a href="cushions.html">Cushions</a><a href="electronics.html">Electronics</a></nav>
<main>
<div class="top"><div><h1 id="h1">1 · Footing</h1><div class="stage" id="stage"></div></div>
<div class="lang"><button id="bEn" class="on" onclick="setL('en')">English</button><button id="bTh" onclick="setL('th')">ภาษาไทย</button></div></div>
<div class="fig" id="fig"></div>
<div class="bar"><button class="arrow" id="prev" aria-label="Previous step">&#9664;</button>
<div class="mid"><div class="count" id="count"></div><div class="dots" id="dots"></div></div>
<button class="arrow" id="next" aria-label="Next step">&#9654;</button></div>
<div class="txt" id="txt"></div>
<p class="note" id="foot"></p>
</main>
<script>
let LANG='en';
const K=()=>innerWidth<600?1.7:1;
addEventListener('resize',()=>render());
const T=(en,th)=>LANG==='th'?th:en;
// ---------- drawing helpers ----------
const C={grass:'#d6e4bc',grassE:'#9fb878',top:'#7d5f40',sub:'#b48a5a',sand:'#ecd79c',str:'#c0392b',peg:'#9a6a37',dim:'#1d6fb8',lime:'#ffffff',ink:'#2c2c2a',q:'#5f5e5a',bg:'#fbfaf6'};
function tx(x,y,s,o={}){const a=o.a||'middle',sz=(o.s||15)*K(),w=o.w||400,f=o.f||C.ink;
 const halo=o.nohalo?'':`stroke="${C.bg}" stroke-width="4" paint-order="stroke" stroke-linejoin="round"`;
 return `<text x="${x}" y="${y}" text-anchor="${a}" font-size="${sz}" font-weight="${w}" fill="${f}" ${halo}>${s}</text>`}
function arrowHead(x,y,ang){const a=8,b=4,c=Math.cos(ang),s=Math.sin(ang);
 return `<path d="M${x} ${y} L${x-a*c+b*s} ${y-a*s-b*c} L${x-a*c-b*s} ${y-a*s+b*c}Z" fill="${C.dim}"/>`}
function dim(x1,y1,x2,y2,label,o={}){const ang=Math.atan2(y2-y1,x2-x1);
 let s=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${C.dim}" stroke-width="1.6"/>`+arrowHead(x2,y2,ang)+arrowHead(x1,y1,ang+Math.PI);
 const mx=(x1+x2)/2+(o.dx||0),my=(y1+y2)/2+(o.dy||0);
 return s+tx(mx,my,label,{f:C.dim,w:700,s:o.s||15,a:o.a})}
function peg(x,gy,h=40,notch=false){let s=`<rect x="${x-5}" y="${gy-h}" width="10" height="${h+28}" fill="${C.peg}"/><path d="M${x-5} ${gy+28} L${x} ${gy+40} L${x+5} ${gy+28}Z" fill="${C.peg}"/>`;
 if(notch)s+=`<line x1="${x-8}" y1="${gy-32}" x2="${x+8}" y2="${gy-32}" stroke="${C.ink}" stroke-width="2"/>`;return s}
function pegTop(x,y){return `<rect x="${x-7}" y="${y-7}" width="14" height="14" fill="${C.peg}" stroke="#6e4a22" stroke-width="1.5"/>`}
function svg(body,h=470){return `<svg viewBox="0 0 800 ${h}" xmlns="http://www.w3.org/2000/svg" role="img" font-family="inherit"><rect width="800" height="${h}" fill="${C.bg}"/>${body}</svg>`}
function viewTag(t){return tx(16,28,t,{a:'start',s:14,w:700,f:C.q})}
// plan view: 3.5 m square, centre (400,240), 114 px per m
const P={cx:400,cy:240,S:114};
function planBase(o={}){const {cx,cy,S}=P,h=1.75*S;let s=`<rect x="0" y="0" width="800" height="470" fill="${C.grass}"/>`;
 for(let i=0;i<60;i++){const x=(i*137)%800,y=(i*89)%470;s+=`<path d="M${x} ${y} l3 -8 l3 8" stroke="${C.grassE}" fill="none" stroke-width="1.2"/>`}
 s+=`<rect x="${cx-h}" y="${cy-h}" width="${2*h}" height="${2*h}" fill="#e3cfa8" stroke="${C.q}" stroke-dasharray="7 5" stroke-width="1.5"/>`;
 return s}
// section view: grade y=200, centre x=400, 160 px per m
const X={cx:400,gy:200,S:160};
function secBase(o={}){const {cx,gy,S}=X;const d=(o.depth||0)*S,r=S;let s='';
 s+=`<rect x="0" y="${gy}" width="800" height="${470-gy}" fill="${C.sub}"/><rect x="0" y="${gy}" width="800" height="${0.25*S}" fill="${C.top}"/>`;
 s+=`<rect x="0" y="${gy-6}" width="800" height="6" fill="${C.grassE}"/>`;
 if(d>0){s+=`<rect x="${cx-r}" y="${gy-6}" width="${2*r}" height="${d+6}" fill="${C.bg}"/>`;
  s+=`<path d="M${cx-r} ${gy} V${gy+d} H${cx+r} V${gy}" fill="none" stroke="#5b4026" stroke-width="2"/>`}
 if(o.sand){const t=0.05*S;s+=`<rect x="${cx-r}" y="${gy+d-t}" width="${2*r}" height="${t}" fill="${C.sand}" stroke="#a88f4a" stroke-width="1"/>`}
 return s}
function strings(y){return `<line x1="160" y1="${y}" x2="640" y2="${y}" stroke="${C.str}" stroke-width="2"/>`}
// ---------- steps ----------
const steps=[
{t:()=>T('Clear the ground and mark the centre','ถางพื้นที่และปักหมุดกลาง'),
 fig:()=>{const {cx,cy,S}=P;let s=planBase();
  s+=`<circle cx="${cx}" cy="${cy}" r="9" fill="${C.peg}" stroke="#6e4a22" stroke-width="2"/>`;
  s+=tx(cx,cy-20,T('Centre stake','หมุดกลาง'),{w:700});
  s+=dim(cx-1.75*S,cy+1.75*S+24,cx+1.75*S,cy+1.75*S+24,'3,500',{dy:-8});
  s+=dim(cx+1.75*S+24,cy-1.75*S,cx+1.75*S+24,cy+1.75*S,'3,500',{dx:30});
  s+=tx(cx,cy+70,T('Cleared: no plants, no roots','ถางหญ้าและรากไม้ออกหมด'),{f:C.q});
  s+=viewTag(T('PLAN (from above) · mm','มุมมองจากด้านบน · มม.'));return svg(s)},
 body:()=>T(`<ol><li>Clear plants and roots from a square <b>3,500 × 3,500 mm</b>.</li><li>Drive 1 wooden stake at the point where the centre of Lotus 1.0 will stand.</li></ol>
<p class="note">Tools for the whole hole: 5 wooden stakes, 20 m string, line level, plumb bob, tape measure, lime powder, hoe, shovel, digging bar, hand tamper. Sand: buy 0.20 m³ (0.157 m³ after tamping).</p>`,
`<ol><li>ถางหญ้าและรากไม้ออก เป็นพื้นที่สี่เหลี่ยม <b>3,500 × 3,500 มม.</b></li><li>ตอกหมุดไม้ 1 ตัว ตรงจุดศูนย์กลางของ Lotus 1.0</li></ol>
<p class="note">อุปกรณ์สำหรับขุดหลุม: หมุดไม้ 5 ตัว เชือก 20 ม. ระดับน้ำแขวนเชือก ลูกดิ่ง ตลับเมตร ปูนขาว จอบ พลั่ว ชะแลง ที่กระทุ้งดิน ทราย: ซื้อ 0.20 ลบ.ม. (เหลือ 0.157 ลบ.ม. หลังกระทุ้งแน่น)</p>`)},

{t:()=>T('Set 4 reference pegs and 2 level strings','ปักหมุดอ้างอิง 4 ตัว ขึงเชือก 2 เส้นให้ได้ระดับ'),
 fig:()=>{const {cx,cy,S}=P,o=1.5*S;let s=planBase();
  const pg=[[cx-o,cy],[cx+o,cy],[cx,cy-o],[cx,cy+o]];
  s+=`<g stroke="${C.dim}" stroke-dasharray="5 4" stroke-width="1.3"><line x1="${cx-o}" y1="${cy}" x2="${cx}" y2="${cy-o}"/><line x1="${cx}" y1="${cy-o}" x2="${cx+o}" y2="${cy}"/><line x1="${cx+o}" y1="${cy}" x2="${cx}" y2="${cy+o}"/><line x1="${cx}" y1="${cy+o}" x2="${cx-o}" y2="${cy}"/></g>`;
  s+=`<line x1="${cx-o}" y1="${cy}" x2="${cx+o}" y2="${cy}" stroke="${C.str}" stroke-width="2.5"/><line x1="${cx}" y1="${cy-o}" x2="${cx}" y2="${cy+o}" stroke="${C.str}" stroke-width="2.5"/>`;
  pg.forEach(p=>s+=pegTop(p[0],p[1]));
  s+=`<circle cx="${cx}" cy="${cy}" r="7" fill="${C.peg}" stroke="#6e4a22" stroke-width="2"/>`;
  s+=dim(cx,cy+22,cx+o,cy+22,'1,500',{dy:18});
  s+=tx(cx+o/2+38,cy-o/2-8,T('check 2,121','ตรวจ 2,121'),{f:C.dim,w:700,a:'start'});
  s+=tx(cx-o/2-30,cy-o/2-8,'2,121',{f:C.dim,w:700,a:'end'});
  s+=tx(cx-o-12,cy-16,T('peg','หมุด'),{a:'end'});s+=tx(cx+18,cy-o+5,T('string','เชือก'),{a:'start',f:C.str,w:700});
  // inset elevation
  const ix=618,iy=320;s+=`<rect x="${ix}" y="${iy}" width="172" height="140" rx="8" fill="${C.bg}" stroke="${C.line||'#d8d4c9'}"/>`;
  s+=`<rect x="${ix}" y="${iy+95}" width="172" height="45" fill="${C.sub}"/><rect x="${ix}" y="${iy+91}" width="172" height="5" fill="${C.grassE}"/>`;
  s+=`<rect x="${ix+81}" y="${iy+70}" width="10" height="45" fill="${C.peg}"/><line x1="${ix+8}" y1="${iy+48}" x2="${ix+164}" y2="${iy+48}" stroke="${C.str}" stroke-width="2.5"/>`;
  s+=dim(ix+120,iy+48,ix+120,iy+91,'H',{dx:14,a:'start'});
  s+=tx(ix+86,iy+22,T('Side view','ด้านข้าง'),{s:13,f:C.q});
  s+=viewTag(T('PLAN (from above) · mm','มุมมองจากด้านบน · มม.'));return svg(s)},
 body:()=>T(`<ol><li>Drive 4 pegs <b>1,500 mm</b> from the centre stake, on 2 lines at right angles.</li><li>Check the right angle: each pair of neighbouring pegs is <b>2,121 mm</b> apart, all 4 sides.</li><li>Tie 2 strings between opposite pegs so they cross exactly over the centre stake, one touching the other.</li><li>Make both strings level with the line level. Cut a notch in each peg at the string height.</li><li>Measure from the string down to the ground at the centre stake. Write it down: this is <b>H</b>.</li></ol>
<p class="note">The strings mark the centre and the depth after the centre stake is dug out. Leave the pegs in until the pad is poured.</p>`,
`<ol><li>ตอกหมุด 4 ตัว ห่างจากหมุดกลาง <b>1,500 มม.</b> เป็น 2 แนวตั้งฉากกัน</li><li>ตรวจมุมฉาก: หมุดที่อยู่ติดกันต้องห่างกัน <b>2,121 มม.</b> ครบทั้ง 4 ด้าน</li><li>ขึงเชือก 2 เส้นระหว่างหมุดที่อยู่ตรงข้ามกัน ให้ตัดกันตรงเหนือหมุดกลางพอดี เชือกแตะกัน</li><li>ใช้ระดับน้ำแขวนเชือกปรับให้เชือกทั้ง 2 เส้นได้ระดับ บากรอยที่หมุดทุกตัวตรงระดับเชือก</li><li>วัดจากเชือกลงถึงดินที่หมุดกลาง จดตัวเลขไว้ นี่คือ <b>H</b></li></ol>
<p class="note">เชือกใช้หาจุดศูนย์กลางและความลึก หลังจากหมุดกลางถูกขุดออก ห้ามถอนหมุดจนกว่าจะเทฐานเสร็จ</p>`)},

{t:()=>T('Mark the 2,000 mm circle','ตีวงกลมกว้าง 2,000 มม.'),
 fig:()=>{const {cx,cy,S}=P,o=1.5*S;let s=planBase();
  s+=`<g opacity=".45"><line x1="${cx-o}" y1="${cy}" x2="${cx+o}" y2="${cy}" stroke="${C.str}" stroke-width="2"/><line x1="${cx}" y1="${cy-o}" x2="${cx}" y2="${cy+o}" stroke="${C.str}" stroke-width="2"/>${[[cx-o,cy],[cx+o,cy],[cx,cy-o],[cx,cy+o]].map(p=>pegTop(p[0],p[1])).join('')}</g>`;
  s+=`<circle cx="${cx}" cy="${cy}" r="${S}" fill="none" stroke="${C.lime}" stroke-width="9"/><circle cx="${cx}" cy="${cy}" r="${S}" fill="none" stroke="#9a968c" stroke-width="1"/>`;
  const a=-0.75,ex=cx+S*Math.cos(a),ey=cy+S*Math.sin(a);
  s+=`<line x1="${cx}" y1="${cy}" x2="${ex}" y2="${ey}" stroke="${C.ink}" stroke-width="2"/><circle cx="${ex}" cy="${ey}" r="5" fill="${C.ink}"/>`;
  s+=tx((cx+ex)/2-10,(cy+ey)/2-10,'1,000',{f:C.dim,w:700,a:'end'});
  s+=`<circle cx="${cx}" cy="${cy}" r="7" fill="${C.peg}" stroke="#6e4a22" stroke-width="2"/>`;
  s+=dim(cx-S,cy+S+30,cx+S,cy+S+30,'Ø2,000',{dy:-8});
  s+=tx(cx+S+16,cy+S-10,T('lime powder line','เส้นปูนขาว'),{a:'start',w:700});
  s+=viewTag(T('PLAN (from above) · mm','มุมมองจากด้านบน · มม.'));return svg(s)},
 body:()=>T(`<ol><li>Tie a loop of string round the centre stake. Mark the string <b>1,000 mm</b> from the stake.</li><li>Keep the string tight and walk it round. Pour lime powder along the mark.</li><li>Check: the circle is <b>2,000 mm</b> across in both string directions.</li></ol>`,
`<ol><li>ผูกเชือกเป็นห่วงคล้องหมุดกลาง ทำเครื่องหมายบนเชือก ห่างจากหมุด <b>1,000 มม.</b></li><li>ดึงเชือกให้ตึงแล้วเดินวนรอบ โรยปูนขาวตามเครื่องหมาย</li><li>ตรวจ: วงกลมกว้าง <b>2,000 มม.</b> ทั้ง 2 แนวเชือก</li></ol>`)},

{t:()=>T('Dig the hole, straight sides','ขุดหลุม ผนังตั้งตรง'),
 fig:()=>{const {cx,gy,S}=X;let s=secBase({depth:0.6});
  s+=peg(160,gy,40,true)+peg(640,gy,40,true);
  s+=`<line x1="160" y1="${gy-32}" x2="640" y2="${gy-32}" stroke="${C.str}" stroke-width="1.5" stroke-dasharray="6 6" opacity=".6"/>`;
  s+=`<path d="M${cx+S+S} ${gy} Q${cx+S+S+50} ${gy-90} 800 ${gy-110} V${gy}Z" fill="${C.sub}" stroke="#7b5a35" stroke-width="1.5"/>`;
  s+=dim(cx-S,gy+0.6*S+30,cx+S,gy+0.6*S+30,'2,000',{dy:-8});
  s+=dim(cx-S-30,gy,cx-S-30,gy+0.6*S,'600',{dx:-10,a:'end'});
  s+=dim(cx+S,gy-50,cx+2*S,gy-50,'≥ 1,000',{dy:-10});
  s+=tx(790,gy-125,T('dug soil','ดินที่ขุด'),{w:700,a:'end'});
  s+=tx(20,gy+26,T('topsoil','ดินหน้า'),{f:'#fff',s:14,w:700,a:'start',nohalo:1});
  s+=tx(20,gy+0.6*S+60,T('firm subsoil','ดินเดิมแน่น'),{a:'start',s:14,w:700,f:'#fff',nohalo:1});
  s+=tx(160,gy-58,T('notch','รอยบาก'),{s:13});
  s+=viewTag(T('SECTION (cut through the middle) · mm','ภาพตัดกลางหลุม · มม.'));return svg(s)},
 body:()=>T(`<ol><li>If the strings are in the way, untie them. The notches keep their height.</li><li>Dig inside the lime line. Keep the sides vertical: <b>2,000 mm</b> across from top to bottom.</li><li>Dig to <b>600 mm</b> deep. Step 5 checks it exactly. The centre stake comes out; that is fine.</li><li>Pile the soil at least <b>1,000 mm</b> from the edge. Keep it: it is packed back around the cone later. Volume: 1.89 m³.</li></ol>`,
`<ol><li>ถ้าเชือกเกะกะ ปลดออกได้ รอยบากที่หมุดเก็บระดับไว้</li><li>ขุดภายในเส้นปูนขาว ผนังหลุมตั้งตรง กว้าง <b>2,000 มม.</b> ตั้งแต่ปากถึงก้นหลุม</li><li>ขุดลึก <b>600 มม.</b> ขั้นที่ 5 ตรวจละเอียดอีกครั้ง หมุดกลางหลุดออกได้ ไม่เป็นไร</li><li>กองดินห่างจากขอบหลุมอย่างน้อย <b>1,000 มม.</b> เก็บไว้ ใช้ถมรอบกรวยภายหลัง ปริมาณดิน 1.89 ลบ.ม.</li></ol>`)},

{t:()=>T('Check the depth and the bottom','ตรวจความลึกและก้นหลุม'),
 fig:()=>{const {cx,gy,S}=X,sy=gy-32,by=gy+0.6*S;let s=secBase({depth:0.6});
  s+=peg(160,gy,40,true)+peg(640,gy,40,true)+strings(sy);
  [cx,cx+0.9*S].forEach((x,i)=>{s+=`<line x1="${x}" y1="${sy}" x2="${x}" y2="${by-14}" stroke="${C.ink}" stroke-width="1.2"/><path d="M${x-6} ${by-14} L${x+6} ${by-14} L${x} ${by-1}Z" fill="${C.ink}"/>`;
   s+=dim(x-14,sy,x-14,by,'H + 600',{dx:-8,a:'end'})});
  s+=tx(cx,sy-12,T('plumb bob','ลูกดิ่ง'),{s:13});
  s+=dim(cx,by+26,cx+0.9*S,by+26,'900',{dy:18});
  // inset plan 5 points
  const ix=680,iy=100,r=44;s+=`<circle cx="${ix}" cy="${iy}" r="${r}" fill="${C.bg}" stroke="#5b4026" stroke-width="1.5"/><line x1="${ix-r-14}" y1="${iy}" x2="${ix+r+14}" y2="${iy}" stroke="${C.str}"/><line x1="${ix}" y1="${iy-r-14}" x2="${ix}" y2="${iy+r+14}" stroke="${C.str}"/>`;
  [[0,0],[1,0],[-1,0],[0,1],[0,-1]].forEach(p=>s+=`<circle cx="${ix+p[0]*r*0.9}" cy="${iy+p[1]*r*0.9}" r="5" fill="${C.dim}"/>`);
  s+=tx(ix,iy-r-22,T('5 points, from above','5 จุด มองจากบน'),{s:13,w:700});
  s+=tx(20,by+40,T('firm subsoil','ดินเดิมแน่น'),{a:'start',s:14,w:700,f:'#fff',nohalo:1});
  s+=viewTag(T('SECTION · mm','ภาพตัด · มม.'));return svg(s)},
 body:()=>T(`<ol><li>Re-tie the strings at the notches.</li><li>Hang the plumb bob from the string crossing. Measure from the string to the bottom: it must be <b>H + 600 mm</b>.</li><li>Repeat at 4 more points, <b>900 mm</b> out from the centre along each string. All 5 within <b>20 mm</b> of H + 600.</li><li>The bottom must be firm, undisturbed subsoil, not dark topsoil. Scrape off loose crumbs. Stand on one heel: the print must be under <b>5 mm</b> deep.</li><li>Soft or still topsoil? Dig deeper until firm, then fill back to H + 600 with sand tamped in 50 mm layers.</li></ol>`,
`<ol><li>ขึงเชือกกลับที่รอยบาก</li><li>ห้อยลูกดิ่งจากจุดตัดเชือก วัดจากเชือกลงถึงก้นหลุม ต้องได้ <b>H + 600 มม.</b></li><li>วัดอีก 4 จุด ห่างจากศูนย์กลาง <b>900 มม.</b> ตามแนวเชือก ทั้ง 5 จุดต่างจาก H + 600 ไม่เกิน <b>20 มม.</b></li><li>ก้นหลุมต้องเป็นดินเดิมแน่น ไม่ใช่ดินหน้าสีดำ ขูดเศษดินร่วนออก ยืนส้นเท้าเดียว รอยยุบต้องลึกไม่เกิน <b>5 มม.</b></li><li>ถ้ายังนิ่มหรือยังเป็นดินหน้า ขุดลึกต่อจนแน่น แล้วเติมทรายกลับถึง H + 600 กระทุ้งทีละชั้น 50 มม.</li></ol>`)},

{t:()=>T('Lay and tamp the sand bed','ปูทรายรองพื้น กระทุ้งแน่น'),
 fig:()=>{const {cx,gy,S}=X,sy=gy-32,by=gy+0.6*S,ty=by-0.05*S;let s=secBase({depth:0.6,sand:true});
  s+=peg(160,gy,40,true)+peg(640,gy,40,true)+strings(sy);
  s+=`<line x1="${cx}" y1="${sy}" x2="${cx}" y2="${ty-14}" stroke="${C.ink}" stroke-width="1.2"/><path d="M${cx-6} ${ty-14} L${cx+6} ${ty-14} L${cx} ${ty-1}Z" fill="${C.ink}"/>`;
  s+=dim(cx+14,sy,cx+14,ty,'H + 550',{dx:8,a:'start'});
  s+=`<line x1="${cx+60}" y1="${by-2}" x2="${cx+60}" y2="${by+34}" stroke="#fff" stroke-width="1.5"/>`+tx(cx+60,by+58,T('sand 50 mm, tamped','ทราย 50 มม. กระทุ้งแน่น'),{w:700,f:'#fff',nohalo:1});
  // tamper
  const tx0=cx-90;s+=`<rect x="${tx0-26}" y="${ty-14}" width="52" height="12" fill="#6b6b66"/><rect x="${tx0-3}" y="${ty-80}" width="6" height="66" fill="${C.peg}"/><rect x="${tx0-18}" y="${ty-84}" width="36" height="6" fill="${C.peg}"/>`;
  s+=tx(tx0,sy-14,T('hand tamper','ที่กระทุ้ง'),{s:13});
  s+=viewTag(T('SECTION · mm','ภาพตัด · มม.'));return svg(s)},
 body:()=>T(`<ol><li>Spread the sand over the whole bottom, 70 mm deep before tamping.</li><li>Wet it and tamp it until it is <b>50 mm</b> thick and hard.</li><li>Check at the same 5 points: string to sand = <b>H + 550 mm</b>, all within 10 mm.</li></ol>
<p class="note">Hole done. The pad liner goes in next.</p>`,
`<ol><li>เกลี่ยทรายทั่วก้นหลุม หนา 70 มม. ก่อนกระทุ้ง</li><li>รดน้ำแล้วกระทุ้งจนเหลือหนา <b>50 มม.</b> และแน่น</li><li>ตรวจที่ 5 จุดเดิม: จากเชือกถึงหน้าทราย = <b>H + 550 มม.</b> ต่างกันไม่เกิน 10 มม.</li></ol>
<p class="note">ขุดหลุมเสร็จ ขั้นต่อไปคือปูผ้าปูก้นหลุม</p>`)}
];
const STAGE=()=>T('Stage 1 of the footing: dig the hole','ขั้นที่ 1 ของฐานราก: ขุดหลุม');
// ---------- stepper ----------
let i=0;
function go(n){i=Math.max(0,Math.min(steps.length-1,n));render();try{history.replaceState(null,'','#'+(i+1))}catch(e){}}
function render(){const st=steps[i];
 document.getElementById('stage').textContent=STAGE();
 document.getElementById('h1').textContent=T('1 · Footing','1 · ฐานราก');
 document.getElementById('fig').innerHTML=st.fig();
 document.getElementById('count').textContent=T('Step ','ขั้นที่ ')+(i+1)+' / '+steps.length;
 document.getElementById('txt').innerHTML='<h2>'+(i+1)+'. '+st.t()+'</h2>'+st.body();
 document.getElementById('prev').disabled=i===0;document.getElementById('next').disabled=i===steps.length-1;
 document.getElementById('dots').innerHTML=steps.map((_,k)=>`<button class="${k===i?'on':''}" aria-label="${k+1}" onclick="go(${k})"></button>`).join('');
 document.getElementById('foot').innerHTML=T('Diagrams for the next stages (forms, rebar, pour) are being drawn. Until then: <a href="footing-text.html">footing text version</a>.','แผนภาพขั้นต่อไป (แบบผ้าใบ เหล็ก เทคอนกรีต) กำลังทำ ระหว่างนี้ดู <a href="footing-text.html">ฉบับตัวหนังสือ</a>');}
document.getElementById('prev').onclick=()=>go(i-1);document.getElementById('next').onclick=()=>go(i+1);
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(i+1);if(e.key==='ArrowLeft')go(i-1)});
let sx=null;const fg=document.getElementById('fig');
fg.addEventListener('touchstart',e=>{sx=e.touches[0].clientX},{passive:true});
fg.addEventListener('touchend',e=>{if(sx===null)return;const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>50)go(i+(dx<0?1:-1));sx=null});
function setL(l){LANG=l;document.body.classList.toggle('th',l==='th');document.getElementById('bEn').classList.toggle('on',l==='en');document.getElementById('bTh').classList.toggle('on',l==='th');try{localStorage.setItem('lp-lang',l)}catch(e){}render()}
try{if(localStorage.getItem('lp-lang')==='th')LANG='th'}catch(e){}
const h=parseInt(location.hash.slice(1));if(h>0)i=Math.min(steps.length,h)-1;
setL(LANG);
</script>
</body></html>
