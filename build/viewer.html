<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Lotus 1.0 · 3D model</title>
<style>
  html,body{margin:0;height:100%;background:#f4f1ea;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#2c2c2a;overflow:hidden}
  #app{position:fixed;inset:0}
  canvas{display:block;touch-action:none}
  #bar{position:fixed;left:0;right:0;top:0;display:flex;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;gap:6px;padding:8px;background:rgba(244,241,234,.92);border-bottom:1px solid #d3d1c7;z-index:5}
  #bar button{flex:0 0 auto;white-space:nowrap;font:500 12px/1 inherit;padding:7px 8px;border-radius:8px;border:1px solid #b4b2a9;background:#fff;color:#2c2c2a;cursor:pointer}
  #bar button.on{background:#633806;color:#fff;border-color:#633806}
  #bar button.measure.on{background:#d85a30;border-color:#d85a30}
  #panel{position:fixed;left:8px;right:8px;bottom:8px;background:rgba(255,255,255,.95);border:1px solid #d3d1c7;border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.45;z-index:5;max-height:24vh;overflow:auto;font-size:12px}
  #panel b{font-weight:500}
  #panel .row{display:flex;justify-content:space-between;gap:10px}
  #hint{color:#5f5e5a}
  .lbl{position:fixed;transform:translate(-50%,-50%);background:#fff;border:1px solid #444441;border-radius:6px;padding:2px 6px;font-size:12px;white-space:nowrap;pointer-events:none;z-index:4}
  .lbl.dim{border-color:#185fa5;color:#0c447c}
  .lbl.meas{border-color:#d85a30;color:#712b13;font-weight:500}
  #legend span{display:inline-block;width:10px;height:10px;border-radius:2px;margin:0 4px 0 10px;vertical-align:-1px}
  #legend span:first-child{margin-left:0}
</style>
</head>
<body>
<div id="app"></div>
<div id="bar">
  <button id="bMeasure" class="measure">Measure</button>
  <button id="bClear">Clear</button>
  <button id="bReset">Reset view</button>
  <button id="tStrips" class="on">Ribs</button>
  <button id="tCore" class="on">Walls</button>
  <button id="tPattern" class="on">Pattern</button>
  <button id="tLed" class="on">LED tubes</button>
  <button id="tGill" class="on">Gill</button>
  <button id="tJoints" class="on">Joints</button>
  <button id="tDims" class="on">Dimensions</button>
  <button id="tLabels" class="on">Labels</button>
  <button id="tTop" class="on">Steel + brass</button>
  <button id="tFloor" class="on">Floor</button>
  <button id="tCtx">Pod context</button>
  <button id="bCopies">Gores: 1</button>
  <button id="tCush" class="on">Cushion</button>
  <button id="c0" class="on">C1 foot L</button>
  <button id="c1" class="on">C2 long L</button>
  <button id="c2" class="on">C3 right</button>
  <button id="c3" class="on">C4 foot R</button>
  <button id="tSleep">Sleep mode</button>
  <button id="tTable" class="on">Table</button>
  <button id="bDoor">Door: closed</button>
  <button id="bSun">Sun: off</button>
  <button id="tPeople" class="on">People</button>
  <button id="tFins" class="on">Rib fins</button>
  <button id="bFins">Fin ring: 0°</button>
  <button id="tFoot" class="on">Footing</button>
  <button id="tRebar" class="on">Rebar</button>
  <button id="tGround" class="on">Ground</button>
  <button id="tDoorG" class="on">Door gore</button>
</div>
<div id="panel">
  <div id="hint">Drag to turn, pinch or scroll to zoom. Tap <b>Measure</b>, then tap two points on the gore to get the distance between them.</div>
  <div id="meas"></div>
  <div id="legend" style="margin-top:6px;color:#5f5e5a">
    <span style="background:#b07a3c"></span>Female strip<span style="background:#d8a464"></span>Male strip<span style="background:#f2b04a"></span>Translucent wall<span style="background:#6e5a48"></span>Seat<span style="background:#e39a3b"></span>Back wall (glows)<span style="background:#5a3412"></span>Hoops + diagonals<span style="background:#6fb4ff"></span>LED tube<span style="background:#c98b4a"></span>Gill<span style="background:#8a8278"></span>Cushion
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
// ---------- profile (inner edge of rib), metres; y = 0 at seat level, axis = Y ----------
function cubic(p0,p1,p2,p3,n){const o=[];for(let k=0;k<=n;k++){const t=k/n,u=1-t;o.push([u*u*u*p0[0]+3*u*u*t*p1[0]+3*u*t*t*p2[0]+t*t*t*p3[0],u*u*u*p0[1]+3*u*u*t*p1[1]+3*u*t*t*p2[1]+t*t*t*p3[1]]);}return o;}
function quad(p0,p1,p2,n){const o=[];for(let k=0;k<=n;k++){const t=k/n,u=1-t;o.push([u*u*p0[0]+2*u*t*p1[0]+t*t*p2[0],u*u*p0[1]+2*u*t*p1[1]+t*t*p2[1]]);}return o;}
let raw=[];for(let k=0;k<=8;k++)raw.push([0.084,-1.10+0.20*k/8]); // bottom staves hugging the post
for(let k=1;k<=12;k++)raw.push([0.084,-0.90+0.58*k/12]); // joint 1 (y -0.862) up the stave to joint 2
for(let k=1;k<=12;k++)raw.push([0.084+0.316*k/12,-0.32]); // flat floor: joint 2 (centre) to joint 3 (heel)
raw.push([0.40,-0.10]);
for(let k=1;k<=24;k++){const a=Math.PI/2*k/24;raw.push([0.50-0.10*Math.cos(a),-0.10+0.10*Math.sin(a)]);} // knee: smooth 90 deg turn, radius 100 mm, no bulge
raw.push([0.76,0.0]);
raw.push([1.20,0.0]);
raw=raw.concat(quad([1.20,0.0],[1.35,0.0],[1.35,0.15],16));
raw.push([1.35,0.50]);
raw=raw.concat(cubic([1.35,0.50],[1.35,0.82],[1.10,1.10],[0.78,1.28],40));
raw=raw.concat(cubic([0.78,1.28],[0.45,1.44],[0.084,1.55],[0.084,1.80],48));
for(let k=1;k<=8;k++)raw.push([0.084,1.80+0.20*k/8]); // vertical tip hugging the pipe
let cut=raw;
// resample by arc length
const segL=[0];for(let i=1;i<cut.length;i++){segL.push(segL[i-1]+Math.hypot(cut[i][0]-cut[i-1][0],cut[i][1]-cut[i-1][1]));}
const L=segL[segL.length-1],N=240;const R=[],Yv=[],S=[];
for(let k=0;k<=N;k++){const s=L*k/N;let i=1;while(i<segL.length-1&&segL[i]<s)i++;const a=segL[i-1],b=segL[i];const t=b>a?(s-a)/(b-a):0;R.push(cut[i-1][0]+(cut[i][0]-cut[i-1][0])*t);Yv.push(cut[i-1][1]+(cut[i][1]-cut[i-1][1])*t);S.push(s);}
// outward normals (towards exterior)
const NR=[],NY=[];for(let k=0;k<=N;k++){const k0=Math.max(0,k-1),k1=Math.min(N,k+1);let tr=R[k1]-R[k0],ty=Yv[k1]-Yv[k0];const m=Math.hypot(tr,ty)||1;tr/=m;ty/=m;NR.push(ty);NY.push(-tr);}
// zones
let iShin0=0;for(let k=0;k<=N;k++){if(Yv[k]>=-0.42&&R[k]>0.39){iShin0=k;break;}}
let iBotTip=0;for(let k=0;k<=N;k++){if(2*(Math.PI/16)*R[k]-0.045>=0.015){iBotTip=k;break;}}
let iSeat=0;for(let k=0;k<=N;k++){if(Yv[k]>-0.01&&R[k]>=0.50){iSeat=k;break;}}
let iBack=0;for(let k=iSeat;k<=N;k++){if(R[k]>=1.20){iBack=k;break;}}
let iDome=0;for(let k=iBack;k<=N;k++){if(Yv[k]>=0.50&&R[k]>1.3){iDome=k;break;}}
let iTip=N;for(let k=iDome;k<=N;k++){if(2*(Math.PI/16)*R[k]-0.045<0.015){iTip=k;break;}}
const iTaper=Math.round(iDome+0.6*(iTip-iDome));
const RIB=0.060, TH=Math.PI/16; // half of 22.5 deg
function depths(k){ // [inner depth, outer depth] measured outward from rib inner edge
  if(k<iShin0) return [RIB-0.019,RIB];
  if(k<iSeat) return [0,0.030];
  if(k<iBack) return [0,0.060];
  if(k<iDome) return [0,RIB]; // back corner + back wall: 60 mm, flush with ribs both sides
  if(k<iTaper) return [RIB-0.024,RIB];
  const f=Math.min(1,(k-iTaper)/Math.max(1,iTip-iTaper)); const t=0.024-0.008*f; return [RIB-t,RIB];
}
function P3(r,y,th){return new THREE.Vector3(r*Math.sin(th),y,r*Math.cos(th));}
function at(k,d,th){if(k%1!==0){const a=Math.floor(k),b=Math.min(N,a+1),t=k-a;const r=R[a]+(R[b]-R[a])*t,y=Yv[a]+(Yv[b]-Yv[a])*t,nr=NR[a]+(NR[b]-NR[a])*t,ny=NY[a]+(NY[b]-NY[a])*t;return P3(r+nr*d,y+ny*d,th);}return P3(R[k]+NR[k]*d,Yv[k]+NY[k]*d,th);}
const rAt=k=>{const a=Math.floor(k),b=Math.min(N,a+1),t=k-a;return R[a]+(R[b]-R[a])*t;};
const thA=k=>-TH+0.020/Math.max(rAt(k),0.12); // male side inner edge of core
const thB=k=> TH-0.025/Math.max(rAt(k),0.12); // female side

// ---------- scene ----------
const app=document.getElementById('app');
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));renderer.shadowMap.type=THREE.PCFSoftShadowMap;app.appendChild(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0xf4f1ea);
const camera=new THREE.PerspectiveCamera(40,1,0.01,50);
const controls=new THREE.OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=0.1;
scene.add(new THREE.HemisphereLight(0xffffff,0xb4b2a9,0.85));const dl=new THREE.DirectionalLight(0xffffff,0.7);dl.position.set(2,3,4);scene.add(dl);const dl2=new THREE.DirectionalLight(0xffffff,0.35);dl2.position.set(-3,1,-2);scene.add(dl2);

const groups={strips:new THREE.Group(),core:new THREE.Group(),pattern:new THREE.Group(),led:new THREE.Group(),gill:new THREE.Group(),ctx:new THREE.Group(),dims:new THREE.Group(),top:new THREE.Group(),floor:new THREE.Group(),cushion:new THREE.Group(),sleep:new THREE.Group(),copies:new THREE.Group(),table:new THREE.Group(),joints:new THREE.Group()};
const gore=new THREE.Group();['strips','core','pattern','led','gill'].forEach(n=>gore.add(groups[n]));scene.add(gore);scene.add(groups.ctx);scene.add(groups.dims);scene.add(groups.top);scene.add(groups.floor);scene.add(groups.cushion);scene.add(groups.sleep);scene.add(groups.copies);scene.add(groups.table);groups.sleep.visible=false;groups.ctx.visible=false;
const pickables=[];

function gridMesh(k0,k1,M,fn,mat){ // fn(k,j/M) -> Vector3
  const pos=[],idx=[];const rows=k1-k0+1;
  for(let k=k0;k<=k1;k++)for(let j=0;j<=M;j++){const v=fn(k,j/M);pos.push(v.x,v.y,v.z);}
  for(let a=0;a<rows-1;a++)for(let j=0;j<M;j++){const p=a*(M+1)+j,q=p+M+1;idx.push(p,q,p+1,p+1,q,q+1);}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setIndex(idx);g.computeVertexNormals();
  return new THREE.Mesh(g,mat);
}
function panel(k0,k1,mat){
  const grp=new THREE.Group();const M=10;
  const face=(which)=>gridMesh(k0,k1,M,(k,f)=>{const d=depths(k)[which];const th=thA(k)+(thB(k)-thA(k))*f;return at(k,d,th);},mat);
  const inner=face(0),outer=face(1);grp.add(inner,outer);pickables.push(inner,outer);
  // side walls along both edges
  [0,1].forEach(e=>{const m=gridMesh(k0,k1,1,(k,f)=>{const d=depths(k)[0]+(depths(k)[1]-depths(k)[0])*f;return at(k,d,e?thB(k):thA(k));},mat);grp.add(m);pickables.push(m);});
  return grp;
}
const matTrans=new THREE.MeshStandardMaterial({color:0xf2b04a,transparent:true,opacity:0.55,side:THREE.DoubleSide,roughness:0.5,depthWrite:false});
const matSeat=new THREE.MeshStandardMaterial({color:0x6e5a48,side:THREE.DoubleSide,roughness:0.9});
const matBack=new THREE.MeshStandardMaterial({color:0xe39a3b,transparent:true,opacity:0.6,side:THREE.DoubleSide,roughness:0.5,depthWrite:false}); // translucent honeycomb sandwich
groups.core.add(panel(iBotTip,iShin0,new THREE.MeshStandardMaterial({color:0x9a9188,side:THREE.DoubleSide,roughness:0.9})));
groups.core.add(panel(iShin0,iSeat,matTrans));
groups.core.add(panel(iSeat,iBack,matSeat));
groups.core.add(panel(iBack,iDome,matBack));
groups.core.add(panel(iDome,iTip,matTrans));

// ---------- strips (ribs) ----------
function strip(thE,wSign,width,color,kA,kB){kA=kA??iBotTip;kB=kB??iTip;
  const pos=[],idx=[];const c=new THREE.Vector3(Math.cos(thE),0,-Math.sin(thE)).multiplyScalar(wSign);
  for(let k=kA;k<=kB;k++){const corners=[[0,0],[RIB,0],[RIB,width],[0,width]];for(const [d,w] of corners){const v=at(k,d,thE).add(c.clone().multiplyScalar(w));pos.push(v.x,v.y,v.z);}}
  for(let k=0;k<kB-kA;k++)for(let s=0;s<4;s++){const a=k*4+s,b=k*4+(s+1)%4,a2=a+4,b2=b+4;idx.push(a,a2,b,b,a2,b2);}
  idx.push(0,1,2,0,2,3);const e=(kB-kA)*4;idx.push(e,e+2,e+1,e,e+3,e+2);
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setIndex(idx);g.computeVertexNormals();
  const m=new THREE.Mesh(g,new THREE.MeshStandardMaterial({color,roughness:0.7,side:THREE.DoubleSide}));pickables.push(m);return m;
}
// concrete pedestal runs from the bottom up to joint 7 (top of the back-corner curve)
const CONC=0xe6dcc6;let k7=iBotTip;for(let k=iBotTip;k<=N;k++){if(R[k]>=1.349&&Yv[k]>=0.15){k7=k;break;}}
function tagC(m,ply){m.userData.concrete=true;m.userData.ply=ply;return m;}
groups.strips.add(tagC(strip(TH,-1,0.025,CONC,iBotTip,k7),0xb07a3c));   // female, concrete part
groups.strips.add(tagC(strip(-TH,1,0.020,CONC,iBotTip,k7),0xd8a464));   // male, concrete part
groups.strips.add(strip(TH,-1,0.025,0xb07a3c,k7,iTip));   // female, 25 mm plywood
groups.strips.add(strip(-TH,1,0.020,0xd8a464,k7,iTip));   // male, 20 mm plywood


// ---------- tip wedge: both strips merge into one solid teak stave ----------
(function(){const mat=new THREE.MeshStandardMaterial({color:0xa06a32,roughness:0.7,side:THREE.DoubleSide});const M=6;
  const f=(d)=>gridMesh(iTip,N,M,(k,u)=>at(k,d,-TH+2*TH*u),mat);
  const side=(th)=>gridMesh(iTip,N,1,(k,u)=>at(k,RIB*u,th),mat);
  const parts=[f(0),f(RIB),side(-TH),side(TH)];
  const top=gridMesh(N-1,N,M,(k,u)=>k===N?at(N,RIB,-TH+2*TH*u):at(N,0,-TH+2*TH*u),mat);parts.push(top);
  parts.forEach(m=>{groups.strips.add(m);pickables.push(m);});
  const matC=new THREE.MeshStandardMaterial({color:CONC,roughness:0.9,side:THREE.DoubleSide});
  const fb=(d)=>gridMesh(0,iBotTip,M,(k,u)=>at(k,d,-TH+2*TH*u),matC);
  const sb=(th)=>gridMesh(0,iBotTip,1,(k,u)=>at(k,RIB*u,th),matC);
  const bot=gridMesh(0,1,M,(k,u)=>k===0?at(0,0,-TH+2*TH*u):at(0,RIB,-TH+2*TH*u),matC);
  [fb(0),fb(RIB),sb(-TH),sb(TH),bot].forEach(m=>{groups.strips.add(m);pickables.push(m);});})();

// ---------- pattern: hoops + diagonals in the dome ----------
function domeKAtY(y){let best=iDome,bd=1e9;for(let k=iDome;k<=iTip;k++){const d=Math.abs(Yv[k]-y);if(d<bd){bd=d;best=k;}}return best;}
function midDepth(k){const d=depths(Math.round(k));return (d[0]+d[1])/2;}
function tube(pts,radius,mat){const curve=new THREE.CatmullRomCurve3(pts);const g=new THREE.TubeGeometry(curve,Math.max(8,pts.length*3),radius,6,false);const m=new THREE.Mesh(g,mat);pickables.push(m);return m;}
const matHoop=new THREE.MeshStandardMaterial({color:0x5a3412,roughness:0.6});
const matDiag=new THREE.MeshStandardMaterial({color:0x7a4a1c,roughness:0.6});
const hoops=[0.50,0.68,0.86,1.04,1.22,1.40].filter(y=>y<=Yv[iTip]-0.05);
const hk=hoops.map(domeKAtY);
hk.forEach(k=>{const pts=[];for(let j=0;j<=12;j++){const th=thA(k)+(thB(k)-thA(k))*j/12;pts.push(at(k,midDepth(k),th));}groups.pattern.add(tube(pts,0.006,matHoop));});
for(let h=0;h<hk.length;h++){
  const k1=hk[h],k2=(h+1<hk.length)?hk[h+1]:iTip;
  [[0,1],[1,0]].forEach(([f0,f1])=>{const pts=[];for(let j=0;j<=24;j++){const t=j/24;const k=k1+(k2-k1)*t;const f=f0+(f1-f0)*t;const th=thA(k)+(thB(k)-thA(k))*f;pts.push(at(k,midDepth(k),th));}groups.pattern.add(tube(pts,0.0045,matDiag));});
}
// shin zone diagonals (same pattern, lower)
(function(){const k1=iShin0,k2=iSeat;[[0,1],[1,0]].forEach(([f0,f1])=>{for(let rep=0;rep<2;rep++){const a=k1+(k2-k1)*rep/2,b=k1+(k2-k1)*(rep+1)/2;const pts=[];for(let j=0;j<=24;j++){const t=j/24;const k=a+(b-a)*t;const f=f0+(f1-f0)*t;const th=thA(k)+(thB(k)-thA(k))*f;pts.push(at(k,0.020,th));}groups.pattern.add(tube(pts,0.0045,matDiag));}});})();

// ---------- LED tubes ----------
const matLed=new THREE.MeshStandardMaterial({color:0x6fb4ff,emissive:0x2a6fd1,emissiveIntensity:0.6,roughness:0.3});
function ledRun(k0,k1,dfn){[0,1].forEach(e=>{const pts=[];for(let k=k0;k<=k1;k+=3){const th=e?thB(k)-0.008/R[k]:thA(k)+0.008/R[k];pts.push(at(k,dfn(k),th));}groups.led.add(tube(pts,0.006,matLed));});}
ledRun(iShin0+2,iSeat-2,()=>0.011);                 // shin tube, 13-25 mm from outside of 30 mm wall
ledRun(iDome+2,iTaper,()=>RIB-0.019);        // dome tube
ledRun(iBack+2,iDome-2,()=>RIB-0.012);       // back corner + back wall tube, near the outer face

// ---------- floor gill: plywood web under the floor, joint 1 to joint 3, curved to continue the shin into the stave ----------
(function(){const A=[0.46,-0.32],B=[0.46,-0.56],C=[0.144,-0.62],D=[0.144,-0.862];const pts=[];
  for(let i=0;i<=40;i++){const t=i/40,u=1-t;pts.push([u*u*u*A[0]+3*u*u*t*B[0]+3*u*t*t*C[0]+t*t*t*D[0],u*u*u*A[1]+3*u*u*t*B[1]+3*u*t*t*C[1]+t*t*t*D[1]]);}
  pts.push([0.144,-0.38],[0.46,-0.38]);
  const shape=new THREE.Shape();shape.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)shape.lineTo(pts[i][0],pts[i][1]);shape.lineTo(pts[0][0],pts[0][1]);
  const g=new THREE.ExtrudeGeometry(shape,{depth:0.038,bevelEnabled:false});g.translate(0,0,-0.019);
  const m=new THREE.Mesh(g,new THREE.MeshStandardMaterial({color:CONC,roughness:0.9,side:THREE.DoubleSide}));tagC(m,0xc98b4a);m.rotation.y=TH-Math.PI/2;groups.gill.add(m);pickables.push(m);})();
// ---------- knee gill: rib widened outward from joint 3 to 4, curving to joint 5 (plywood, 2 x 19 mm) ----------
(function(){const pts=[];const W=0.14;
  let k3=0,k5=0;for(let k=0;k<=N;k++){if(R[k]>=0.399&&Yv[k]>=-0.321){k3=k;break;}}for(let k=k3;k<=N;k++){if(R[k]>=0.70&&Yv[k]>-0.01){k5=k;break;}}
  const o=(k)=>[R[k]+NR[k]*RIB,Yv[k]+NY[k]*RIB];
  const A=o(k3),B=[A[0]+W,-0.16],C=o(k5);
  for(let i=0;i<=20;i++){const t=i/20,u=1-t;pts.push([u*u*A[0]+2*u*t*A[0]+t*t*B[0],u*u*A[1]+2*u*t*(-0.13)+t*t*B[1]]);}

function resize(){const w=window.innerWidth,h=window.innerHeight;renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix();}
window.addEventListener('resize',resize);resize();resetView();
const tmp=new THREE.Vector3();
function tick(){requestAnimationFrame(tick);controls.update();updateDoor();updateFins();faceFigures();renderer.render(scene,camera);
  const w=window.innerWidth,h=window.innerHeight;
  for(const o of labels){let vis=showLabels||o.group===marks||o.group===groups.joints,g=o.group;while(g){if(!g.visible){vis=false;break;}g=g.parent;}tmp.copy(o.pos).project(camera);if(!vis||tmp.z>1){o.el.style.display='none';continue;}o.el.style.display='block';o.el.style.left=((tmp.x+1)/2*w)+'px';o.el.style.top=((1-tmp.y)/2*h)+'px';}
}
tick();
})();
</script>
<script>
window.addEventListener('load',()=>{setTimeout(()=>{
 const off=id=>{const e=document.getElementById(id);if(e&&e.classList.contains('on'))e.click();};
 ['tLabels','tJoints','tRebar','tDims','tTable'].forEach(off);
 const c=document.getElementById('bCopies');for(let i=0;i<8&&c&&!/15/.test(c.textContent);i++)c.click();
 document.querySelectorAll('#bar button').forEach(b=>{if(b.id!=='bDoor'&&b.id!=='bFins')b.style.display='none';});
 const p=document.getElementById('panel');if(p)p.style.display='none';
 const fb=document.getElementById('bFins');if(fb){const set=()=>{fb.textContent='Twist fins: '+(fb.textContent.match(/\d+°/)||['0°'])[0];};set();fb.addEventListener('click',()=>setTimeout(set,0));}
 document.querySelectorAll('.lbl').forEach(e=>e.style.visibility='hidden');
},300);});
</script>
</body>
</html>
