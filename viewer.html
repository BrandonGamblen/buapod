<script>
(function(){
// ---------- profile (inner edge of rib), metres; y = 0 at seat level, axis = Y ----------
function cubic(p0,p1,p2,p3,n){const o=[];for(let k=0;k<=n;k++){const t=k/n,u=1-t;o.push([u*u*u*p0[0]+3*u*u*t*p1[0]+3*u*t*t*p2[0]+t*t*t*p3[0],u*u*u*p0[1]+3*u*u*t*p1[1]+3*u*t*t*p2[1]+t*t*t*p3[1]]);}return o;}
function quad(p0,p1,p2,n){const o=[];for(let k=0;k<=n;k++){const t=k/n,u=1-t;o.push([u*u*p0[0]+2*u*t*p1[0]+t*t*p2[0],u*u*p0[1]+2*u*t*p1[1]+t*t*p2[1]]);}return o;}
let raw=[];for(let k=0;k<=8;k++)raw.push([0.084,-1.10+0.20*k/8]); // bottom staves hugging the post
const FLOOR_Y=-0.45; // floor 450 mm below the seat (decided 2026-11-03)
for(let k=1;k<=12;k++)raw.push([0.084,-0.90+(FLOOR_Y+0.90)*k/12]); // joint 1 (y -0.862) up the stave to joint 2
for(let k=1;k<=12;k++)raw.push([0.084+0.316*k/12,FLOOR_Y]); // flat floor: joint 2 (centre) to joint 3 (heel)
raw.push([0.40,-0.10]);
for(let k=1;k<=24;k++){const a=Math.PI/2*k/24;raw.push([0.50-0.10*Math.cos(a),-0.10+0.10*Math.sin(a)]);} // knee: smooth 90 deg turn, radius 100 mm, no bulge
raw.push([0.76,0.0]);
raw.push([1.20,0.0]);
raw=raw.concat(quad([1.20,0.0],[1.35,0.0],[1.35,0.15],16));
raw.push([1.35,0.50]);
raw=raw.concat(cubic([1.35,0.50],[1.35,0.82],[1.10,1.10],[0.78,1.28],40));
raw=raw.concat(cubic([0.78,1.28],[0.45,1.44],[0.084,1.55],[0.084,1.80],48));
for(let k=1;k<=8;k++)raw.push([0.084,1.80+0.20*k/8]); // vertical tip hugging the pipe
let cut=raw;
// resample by arc length
const segL=[0];for(let i=1;i<cut.length;i++){segL.push(segL[i-1]+Math.hypot(cut[i][0]-cut[i-1][0],cut[i][1]-cut[i-1][1]));}
const L=segL[segL.length-1],N=240;const R=[],Yv=[],S=[];
for(let k=0;k<=N;k++){const s=L*k/N;let i=1;while(i<segL.length-1&&segL[i]<s)i++;const a=segL[i-1],b=segL[i];const t=b>a?(s-a)/(b-a):0;R.push(cut[i-1][0]+(cut[i][0]-cut[i-1][0])*t);Yv.push(cut[i-1][1]+(cut[i][1]-cut[i-1][1])*t);S.push(s);}
// outward normals (towards exterior)
const NR=[],NY=[];for(let k=0;k<=N;k++){const k0=Math.max(0,k-1),k1=Math.min(N,k+1);let tr=R[k1]-R[k0],ty=Yv[k1]-Yv[k0];const m=Math.hypot(tr,ty)||1;tr/=m;ty/=m;NR.push(ty);NY.push(-tr);}
// zones
let iShin0=0;for(let k=0;k<=N;k++){if(Yv[k]>=FLOOR_Y-0.01&&R[k]>0.39){iShin0=k;break;}}
let iBotTip=0;for(let k=0;k<=N;k++){if(2*(Math.PI/16)*R[k]-0.045>=0.015){iBotTip=k;break;}}
let iSeat=0;for(let k=0;k<=N;k++){if(Yv[k]>-0.01&&R[k]>=0.50){iSeat=k;break;}}
let iBack=0;for(let k=iSeat;k<=N;k++){if(R[k]>=1.20){iBack=k;break;}}
let iDome=0;for(let k=iBack;k<=N;k++){if(Yv[k]>=0.50&&R[k]>1.3){iDome=k;break;}}
let iTip=N;for(let k=iDome;k<=N;k++){if(2*(Math.PI/16)*R[k]-0.045<0.015){iTip=k;break;}}
const iTaper=Math.round(iDome+0.6*(iTip-iDome));
const RIB=0.060, TH=Math.PI/16; // half of 22.5 deg
function depths(k){ // [inner depth, outer depth] measured outward from rib inner edge
  if(k<iShin0) return [RIB-0.019,RIB];
  if(k<iSeat) return [0,0.030];
  if(k<iBack) return [0,0.060];
  if(k<iDome) return [0,RIB]; // back corner + back wall: 60 mm, flush with ribs both sides
  if(k>=KS.v) return [PWIN-0.003,PWIN]; // removable window: 3 mm polycarbonate sheet, outer face 15 mm out from the inner face
  if(k<iTaper) return [RIB-0.024,RIB];
  const f=Math.min(1,(k-iTaper)/Math.max(1,iTip-iTaper)); const t=0.024-0.008*f; return [RIB-t,RIB];
}
function P3(r,y,th){return new THREE.Vector3(r*Math.sin(th),y,r*Math.cos(th));}
function at(k,d,th){if(k%1!==0){const a=Math.floor(k),b=Math.min(N,a+1),t=k-a;const r=R[a]+(R[b]-R[a])*t,y=Yv[a]+(Yv[b]-Yv[a])*t,nr=NR[a]+(NR[b]-NR[a])*t,ny=NY[a]+(NY[b]-NY[a])*t;return P3(r+nr*d,y+ny*d,th);}return P3(R[k]+NR[k]*d,Yv[k]+NY[k]*d,th);}
const rAt=k=>{const a=Math.floor(k),b=Math.min(N,a+1),t=k-a;return R[a]+(R[b]-R[a])*t;};
const SW=0.020; // each plywood rib strip 20 mm; rib = 2 strips + hidden 6 x 50 mm steel blade in 3 mm grooves = 40 x 60 mm
const thA=k=>-TH+(SW-0.010)/Math.max(rAt(k),0.12); // male side edge of the window sheet (10 mm into the rib rebate)
const thB=k=> TH-(SW-0.010)/Math.max(rAt(k),0.12); // female side
// U wall / arm helpers (pedestal): joint 9, U bottom, inner profile radius at height y, arm half-thickness
const PJ9=1.04,PUB=PJ9-0.34*1.15; // U bottom: 15% deeper swoop (user 2026-11-03): 39.1 cm below joint 9, 1.759 m above ground
const pRcY=y=>{if(y<=0.50)return 1.35;for(let k=1;k<=N;k++){if(Yv[k]>=y&&Yv[k-1]<y&&Yv[k]>0.4){const f=(y-Yv[k-1])/Math.max(1e-9,Yv[k]-Yv[k-1]);return R[k-1]+f*(R[k]-R[k-1]);}}return 0.084;};
const PT=y=>y<=0.15?0.16:y<=PUB?0.16-0.04*(y-0.15)/(PUB-0.15):0.12-0.06*Math.min(1,(y-PUB)/(PJ9-PUB)); // wall 160 mm at the seat, 120 mm at the 1.81 m pour joint (thinnest with steel at both faces, 40 mm cover), arm narrowing to the 60 mm rib at joint 9
const pHalfT=y=>PT(y)/2;
// window frame recess (user 2026-11-03): the U edge of the concrete is cut back 20 mm on its inner 60 mm (where the slats and the polycarbonate sit), leaving a 20 mm concrete lip outside the polycarbonate. Sizes my proposal.
const KS={v:1e9};const PWIN=0.015,PRB=0.020,PRW=PWIN; // recess 20 mm into the edge, 15 mm deep from the inner face: holds polycarbonate (3 mm), 2 slat layers (6 mm), rim slat (3 mm)
const PRT=pRcY(PJ9)+0.030,PGW=(Math.PI/8)*PRT,PDH=PGW/2;
const pEdgeH=d=>{if(d<=SW)return PJ9;if(d>=PDH)return PUB;const t=1-Math.sqrt((d-SW)/(PDH-SW));return PUB+(PJ9-PUB)*t*t;};
const pH=f=>Math.max(pEdgeH(f*PGW),pEdgeH((1-f)*PGW));
const pOff=(dist,n=300)=>{const E=[];for(let i=0;i<=n;i++){const f=i/n;E.push([f*PGW,pH(f)]);}const O=[];for(let i=0;i<=n;i++){const a=E[Math.max(0,i-1)],b=E[Math.min(n,i+1)];let tx=b[0]-a[0],ty=b[1]-a[1];const L=Math.hypot(tx,ty)||1;tx/=L;ty/=L;let nx=-ty,ny=tx;if(ny<0){nx=-nx;ny=-ny;}O.push([E[i][0]-dist*nx,E[i][1]-dist*ny,E[i][1]]);}return O;}; // points dist into the concrete from the U edge: [X, y, edge y]
const pHin=(()=>{const n=600,E=[];for(let i=0;i<=n;i++){const f=i/n;E.push([f*PGW,pH(f)]);}const O=[];
  for(let i=0;i<=n;i++){const a=E[Math.max(0,i-1)],b=E[Math.min(n,i+1)];let tx=b[0]-a[0],ty=b[1]-a[1];const L=Math.hypot(tx,ty)||1;tx/=L;ty/=L;let nx=-ty,ny=tx;if(ny<0){nx=-nx;ny=-ny;}O.push([E[i][0]-PRB*nx,E[i][1]-PRB*ny]);}
  O.sort((p,q)=>p[0]-q[0]);
  return f=>{const X=f*PGW;if(X<=O[0][0])return O[0][1];for(let i=1;i<O.length;i++)if(O[i][0]>=X){const a=O[i-1],b=O[i],t=(X-a[0])/Math.max(1e-9,b[0]-a[0]);return Math.max(PUB-PRB,a[1]+t*(b[1]-a[1]));}return O[O.length-1][1];};})();const PWO=1.35+0.16; // outer radius at the base: outside dia 3.02 m

// ---------- scene ----------
const app=document.getElementById('app');
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));renderer.shadowMap.type=THREE.PCFSoftShadowMap;app.appendChild(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0xf4f1ea);
const camera=new THREE.PerspectiveCamera(40,1,0.01,50);
const controls=new THREE.OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=0.1;
scene.add(new THREE.HemisphereLight(0xffffff,0xb4b2a9,0.85));const dl=new THREE.DirectionalLight(0xffffff,0.7);dl.position.set(2,3,4);scene.add(dl);const dl2=new THREE.DirectionalLight(0xffffff,0.35);dl2.position.set(-3,1,-2);scene.add(dl2);

const groups={strips:new THREE.Group(),core:new THREE.Group(),pattern:new THREE.Group(),led:new THREE.Group(),gill:new THREE.Group(),ctx:new THREE.Group(),dims:new THREE.Group(),top:new THREE.Group(),floor:new THREE.Group(),cushion:new THREE.Group(),sleep:new THREE.Group(),copies:new THREE.Group(),table:new THREE.Group(),joints:new THREE.Group()};
const gore=new THREE.Group();['strips','core','pattern','led','gill'].forEach(n=>gore.add(groups[n]));groups.pattern.visible=false; /* old hoop + diagonal pattern: replaced by the bamboo fan (user 2026-11-03) */scene.add(gore);scene.add(groups.ctx);scene.add(groups.dims);scene.add(groups.top);scene.add(groups.floor);scene.add(groups.cushion);scene.add(groups.sleep);scene.add(groups.copies);scene.add(groups.table);groups.sleep.visible=false;groups.ctx.visible=false;
const pickables=[];

function gridMesh(k0,k1,M,fn,mat){ // fn(k,j/M) -> Vector3
  const pos=[],idx=[];const rows=k1-k0+1;
  for(let k=k0;k<=k1;k++)for(let j=0;j<=M;j++){const v=fn(k,j/M);pos.push(v.x,v.y,v.z);}
  for(let a=0;a<rows-1;a++)for(let j=0;j<M;j++){const p=a*(M+1)+j,q=p+M+1;idx.push(p,q,p+1,p+1,q,q+1);}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setIndex(idx);g.computeVertexNormals();
  return new THREE.Mesh(g,mat);
}
function panel(k0,k1,mat,dfn){const depths_=dfn||depths;
  const grp=new THREE.Group();const M=10;
  const face=(which)=>gridMesh(k0,k1,M,(k,f)=>{const d=depths_(k)[which];const th=thA(k)+(thB(k)-thA(k))*f;return at(k,d,th);},mat);
  const inner=face(0),outer=face(1);grp.add(inner,outer);pickables.push(inner,outer);
  // side walls along both edges
  [0,1].forEach(e=>{const m=gridMesh(k0,k1,1,(k,f)=>{const d=depths_(k)[0]+(depths_(k)[1]-depths_(k)[0])*f;return at(k,d,e?thB(k):thA(k));},mat);grp.add(m);pickables.push(m);});
  return grp;
}
const matTrans=new THREE.MeshStandardMaterial({color:0xf2b04a,transparent:true,opacity:0.55,side:THREE.DoubleSide,roughness:0.5,depthWrite:false});
const matSeat=new THREE.MeshStandardMaterial({color:0x6e5a48,side:THREE.DoubleSide,roughness:0.9});
const matBack=new THREE.MeshStandardMaterial({color:0xe39a3b,transparent:true,opacity:0.6,side:THREE.DoubleSide,roughness:0.5,depthWrite:false}); // translucent honeycomb sandwich
// pedHide: replaced by the concrete pedestal in the 15 fixed gores; kept in the plywood door gore
const ped=o=>{o.traverse(c=>c.userData.pedHide=true);return o;};
let kUB=iDome;for(let k=iDome;k<=N;k++){if(Yv[k]>=PUB){kUB=k;break;}}
let kS=iDome;for(let k=iDome;k<=N;k++){if(Yv[k]>=PUB-PRB){kS=k;break;}}KS.v=kS;
let k9=kUB;for(let k=kUB;k<=N;k++){if(Yv[k]>=PJ9){k9=k;break;}}
groups.core.add(ped(panel(iBotTip,iShin0,new THREE.MeshStandardMaterial({color:0x9a9188,side:THREE.DoubleSide,roughness:0.9}))));
// door gore body (user 2026-11-03: fill in the door): plywood torsion box, 18 mm inner skin + 9 mm outer skin on plywood ribs; 60 mm deep at shin, knee and seat,
// then as thick as the concrete wall beside it (16 cm at the seat tapering to 12 cm at the sill line) so the door reads as part of the wall. Only shown in the door gore.
const matPly=new THREE.MeshStandardMaterial({color:0xc39a62,side:THREE.DoubleSide,roughness:0.75});
const dDoor=k=>{const y=Yv[k];if(k<iBack)return [0,0.060];if(y<0.16)return [0,0.060+(0.16-0.060)*Math.max(0,y)/0.16];return [0,PT(y)];};
groups.core.add(ped(panel(iShin0,iSeat,matPly,dDoor)));
groups.core.add(ped(panel(iSeat,iBack,matPly,dDoor)));
groups.core.add(ped(panel(iBack,iDome,matPly,dDoor)));
groups.core.add(ped(panel(iDome,kS,matPly,dDoor)));
groups.core.add(ped(panel(kS,kUB,matPly,k=>[PRW,PT(Yv[k])])));
// door skins from 2x4 lumber ripped into slats 38 x 19 mm, laid across the gore width (straight chords), screwed to curved plywood ribs (3 per leaf, cut from 18 mm sheet, doubled).
// slats follow the knee and the backrest sweep in short flat steps; plywood only where curves are cut (ribs, U arms). Sizes my proposal.
(function(){const SL=0.038,G=0.002,TT=0.019;const pos=[];const q=(A,B,C,D)=>{pos.push(A.x,A.y,A.z,B.x,B.y,B.z,C.x,C.y,C.z,A.x,A.y,A.z,C.x,C.y,C.z,D.x,D.y,D.z);};
  const kAtS=sv=>{for(let k=0;k<N;k++)if(S[k+1]>=sv)return k+(sv-S[k])/Math.max(1e-9,S[k+1]-S[k]);return N;};
  const slat=(sa,sb,d0,d1,e0,e1)=>{const ka=kAtS(sa),kb=kAtS(sb);if(e0===undefined){e0=d0;e1=d1;}const c=(k,d,e)=>at(k,d,e?thB(k):thA(k));const P=[c(ka,d0,0),c(kb,e0,0),c(kb,e0,1),c(ka,d0,1),c(ka,d1,0),c(kb,e1,0),c(kb,e1,1),c(ka,d1,1)];
    q(P[0],P[1],P[2],P[3]);q(P[4],P[7],P[6],P[5]);q(P[0],P[4],P[5],P[1]);q(P[3],P[2],P[6],P[7]);q(P[1],P[5],P[6],P[2]);q(P[0],P[3],P[7],P[4]);};
  const s0=S[iShin0],s1=S[kUB];const dAt=sv=>dDoor(Math.round(kAtS(sv)))[1];

let TOUR_FOV=null;function setPT(p,tg){controls.target.copy(tg);camera.position.copy(p);camera.lookAt(tg);const f=TOUR&&TOUR_FOV?TOUR_FOV(TOUR.t):40;if(camera.fov!==f){camera.fov=f;camera.updateProjectionMatrix();}}
function setCam(az,el,d,tg){controls.target.copy(tg);camera.position.set(tg.x+d*Math.cos(el)*Math.sin(az),tg.y+d*Math.sin(el),tg.z+d*Math.cos(el)*Math.cos(az));camera.lookAt(tg);}
function tourStep(){const now=performance.now();TOUR.t+=Math.min((now-TOUR.last)/1000,window.__tourCap||0.05);TOUR.last=now;const t=TOUR.t; /* clock capped per frame so a slow first frame (shader compile) does not skip the tour */while(TOUR.i<TOUR.EV.length&&t>=TOUR.EV[TOUR.i][0]){TOUR.EV[TOUR.i][1]();TOUR.i++;}
  const cp=document.getElementById('cap');if(cp)cp.style.opacity=(t>1.3&&t<6.0)?1:0; // caption while the fins close over the roof and reopen
  if(t>=TOUR.END){endTour(false);return;}setPT(...TOUR.fn(t));}
const _tick=tick;tick=function(){if(TOUR)tourStep();_tick();};
tick();
})();
</script>
<script>
window.addEventListener('load',()=>{setTimeout(()=>{
 const off=id=>{const e=document.getElementById(id);if(e&&e.classList.contains('on'))e.click();};
 ['tLabels','tJoints','tRebar','tDims','tTable'].forEach(off);
 const c=document.getElementById('bCopies');for(let i=0;i<8&&c&&!/15/.test(c.textContent);i++)c.click();
 if(/[?&]build/.test(location.search)||location.hash==='#build')return; // build mode (viewer.html?build or #build): all layers and buttons
 const fb=document.getElementById('bFins');if(fb){const set=()=>{fb.textContent='Twist fins: '+(fb.textContent.match(/\d+°/)||['0°'])[0];};set();fb.addEventListener('click',()=>setTimeout(set,0));}
 document.querySelectorAll('.lbl').forEach(e=>e.style.visibility='hidden');
 // Thai labels for visitors in Thailand (time zone Asia/Bangkok or a Thai browser language; a static page has no server-side IP lookup)
 const TH=(()=>{try{return Intl.DateTimeFormat().resolvedOptions().timeZone==='Asia/Bangkok'||/^th\b/i.test(navigator.language||'');}catch(e){return false;}})();
 const db=document.getElementById('bDoor'),tb=document.getElementById('bTour');
 const lab=()=>{const open=db.classList.contains('on'),deg=(fb&&fb.textContent.match(/\d+°/)||['0°'])[0];
   db.textContent=TH?('ประตู: '+(open?'เปิด':'ปิด')):('Door: '+(open?'open':'closed'));if(fb)fb.textContent=(TH?'บิดครีบ: ':'Twist fins: ')+deg;tb.textContent=TH?'ทัวร์':'Tour';};
 db.addEventListener('click',()=>setTimeout(lab,0));if(fb)fb.addEventListener('click',()=>setTimeout(lab,0));lab();
 tb.addEventListener('click',()=>{if(window.__startTour)window.__startTour();setTimeout(lab,0);});
 document.documentElement.classList.remove('prep');if(window.__startTour)window.__startTour();
},300);});
</script>
